<section class="hero" id="inicio" aria-labelledby="hero-titulo">
  <canvas class="hero__geada" aria-hidden="true"></canvas>

  <div class="hero__cena">
    <!-- a caixa da estátua: onde a geada desenha a forma (e a imagem, sem WebGL) -->
    <div class="hero__estatua" data-caixa>
      <img class="hero__estatua-img" src="/img/justica.svg" alt="" width="1200" height="1751" aria-hidden="true">
    </div>

    <div class="hero__texto">
      <h1 class="so-leitor" id="hero-titulo">Rogério Santos, advogado em Cuiabá</h1>

      <div class="hero__lado hero__lado--e">
        <p class="hero__nome hero__nome--e" data-abre>Advocacia em Cuiabá</p>
        <span class="hero__palavra hero__palavra--e" data-palavra aria-hidden="true">Rogério</span>
        <p class="hero__apoio" data-abre>Condomínios, consumidor, empresas e família. Eu atendo, explico cada passo e acompanho o processo do começo ao fim.</p>
      </div>

      <div class="hero__lado hero__lado--d">
        <p class="hero__nome hero__nome--d" data-abre>OAB/MT 16.405 · desde 2013</p>
        <span class="hero__palavra hero__palavra--d" data-palavra aria-hidden="true">Santos</span>
        <div class="hero__acao" data-abre>
          <a class="botao botao--cheio" href="#contato">Falar com o advogado <span class="botao__seta" aria-hidden="true">→</span></a>
          <p class="hero__plantao">Correspondente jurídico em todo o Mato Grosso</p>
        </div>
      </div>
    </div>

    <div class="hero__retrato" data-retrato>
      <img class="hero__foto hero__foto--nitida" src="/img/advogado.webp" alt="Rogério Antunes dos Santos, de terno, de braços cruzados" width="1072" height="1352" fetchpriority="high">
      <img class="hero__foto hero__foto--fosca" src="/img/advogado.webp" alt="" width="1072" height="1352" aria-hidden="true">
    </div>
  </div>
</section>
